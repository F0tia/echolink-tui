[package]
name = "echolink-tui"
version = "0.1.0"
edition = "2024"
description = "EchoLink client for the Linux terminal"
license = "GPL-2.0-or-later"

[profile.release]
strip = true

[dependencies]
anyhow = "1.0.104"
cpal = "0.15"
crossterm = "0.28"
dirs = "7.0.0"
flate2 = "1.1.10"
md5 = "0.8.1"
ratatui = "0.29"
rpassword = "7.5.4"
serde = { version = "1.0.229", features = ["derive"] }
toml = "1.1.8"
